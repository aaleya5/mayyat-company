# nginx/nginx.conf
# ---------------------------------------------------------------------------
# Routes:
#   /api/*       → Express API on port 4000
#   /socket.io/* → Socket.io WebSocket upgrade on port 4000
#   /*           → Serve React SPA from /usr/share/nginx/html
#
# Why Nginx in front of Node?
#   1. Serves static files (React build) without touching Node — much faster
#   2. Handles WebSocket upgrade headers cleanly
#   3. Single public port (80/443) instead of exposing API port directly
#   4. Easy to add SSL termination, rate limiting, and gzip here later
# ---------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    upstream api {
        server api:4000;
        # keepalive: reuse connections to Node instead of re-opening each time
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # -----------------------------------------------------------------
        # API: proxy all /api/* to Express
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";  # disable keep-alive to upstream (managed by keepalive directive)
        }

        # -----------------------------------------------------------------
        # WebSocket: /socket.io/* needs Upgrade headers forwarded
        # -----------------------------------------------------------------
        location /socket.io/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # -----------------------------------------------------------------
        # React SPA: everything else serves index.html
        # (client-side routing handles the rest)
        # -----------------------------------------------------------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively; HTML never cached (SPA entry)
            location ~* \.(js|css|png|jpg|ico|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}